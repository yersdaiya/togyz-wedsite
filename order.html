<body>
<header class="main-header">
<div class="header-top-bar">
<div class="brand-header">
<h1><a href="index.html">TOGYZ BRAND</a></h1>
</div>
<div class="user-actions">
<button onclick="openModal('login-modal')" class="auth-btn">Кіру</button>
<button onclick="openModal('signup-modal')" class="auth-btn signup-btn">Тіркелу</button>
</div>
</div>
</header>
<nav>
<ul class="nav-list">
<li><a href="index.html">БАСТЫ БЕТ</a></li>
<li><a href="catalog.html">КАТАЛОГ</a></li>

<li><a href="reviews.html">ПІКІРЛЕР</a></li>
<li><a href="cart.html">СЕБЕТ 🛒</a></li>
</ul>
</nav>
<main class="page-container">
<h2>ТАПСЫРЫС БЕРУ</h2>

<!-- DEMO: Жалғыз inline style атрибуты (Cascade demo үшін) -->
<section class="form-section" style="border-top: 4px solid #5C061C;">
<form onsubmit="alert('Тапсырысыңыз қабылданды!'); return false;" class="custom-form">
<div class="form-group">
<label for="fullname">Аты-жөніңіз:</label>
<input type="text" id="fullname" placeholder="Толық аты-жөніңізді енгізіңіз" required>
</div>

<div class="form-group">
<label for="phone">Телефон нөміріңіз:</label>
<input type="tel" id="phone" placeholder="+7 (700) 000-00-00" required>
</div>

<!-- Жеткізу аймағы: Қалалар мен облыстар тізімі -->
<div class="form-group">
<label for="region">Жеткізу аймағы (Қала / Облыс):</label>
<select id="region" required class="form-select">
<option value="">Аймақты таңдаңыз...</option>
<optgroup label="Республикалық маңызы бар қалалар">
<option value="astana">Астана қаласы</option>
<option value="almaty">Алматы қаласы</option>
<option value="shymkent">Шымкент қаласы</option>
</optgroup>
<optgroup label="Облыстар">
<option value="zko">Батыс Қазақстан облысы (Орал)</option>
<option value="akmola">Ақмола облысы (Көкшетау)</option>
<option value="aktobe">Ақтөбе облысы</option>
<option value="almaty-obl">Алматы облысы (Қонаев)</option>
<option value="atyrau">Атырау облысы</option>
<option value="zhabyl">Жамбыл облысы (Тараз)</option>
<option value="zhetysu">Жетісу облысы (Талдықорған)</option>
<option value="karaganda">Қарағанды облысы</option>
<option value="kostanay">Қостанай облысы</option>
<option value="kyzylorda">Қызылорда облысы</option>
<option value="mangystau">Маңғыстау облысы (Ақтау)</option>
<option value="pavlodar">Павлодар облысы</option>
<option value="sko">Солтүстік Қазақстан облысы (Петропавл)</option>
<option value="turkestan">Түркістан облысы</option>
<option value="vko">Шығыс Қазақстан облысы (Өскемен)</option>
<option value="abai">Абай облысы (Семей)</option>
<option value="ulytau">Ұлытау облысы (Жезқазған)</option>
</optgroup>
</select>
</div>

<div class="form-group">
<label for="address">Жеткізу мекенжайы:</label>
<input type="text" id="address" placeholder="Көше, үй, пәтер" required>
</div>

<!-- Төлем түрін таңдау -->
<div class="form-group">
<label for="payment">Төлем түрі:</label>
<select id="payment" required class="form-select">
<option value="">Төлем әдісін таңдаңыз...</option>
<option value="kaspi-qr">Kaspi QR / Red / Плюс</option>
<option value="card">Банк картасымен онлайн төлеу</option>
<option value="cash">Жеткізілгенде қолма-қол төлеу</option>
</select>
</div>

<button type="submit" class="submit-btn">Тапсырысты растау</button>
</form>
</section>
</main>
<footer>
<p>&copy; 2026 Togyz Brand. Барлық құқықтар қорғалған.</p>
</footer>
</body>
</html>
