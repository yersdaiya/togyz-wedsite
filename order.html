    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/dariya.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-light border-bottom shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html" style="color: #5C061C;">TOGYZ BRAND</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav mx-auto text-center">
                <li class="nav-item"><a class="nav-link" href="index.html" data-i18n="navHome">БАСТЫ БЕТ</a></li>
                <li class="nav-item"><a class="nav-link" href="catalog.html" data-i18n="navCatalog">КАТАЛОГ</a></li>
                <li class="nav-item"><a class="nav-link" href="size-guide.html" data-i18n="navSize">ӨЛШЕМДЕР КЕСТЕСІ</a></li>
                <li class="nav-item"><a class="nav-link active fw-bold" href="order.html" data-i18n="navOrder">ТАПСЫРЫС БЕРУ</a></li>
                <li class="nav-item"><a class="nav-link" href="reviews.html" data-i18n="navReviews">ПІКІРЛЕР</a></li>
                <li class="nav-item"><a class="nav-link" href="cart.html" data-i18n="navCart">СЕБЕТ 🛒</a></li>
            </ul>
            <div class="auth-buttons-container d-flex justify-content-center gap-2 mt-3 mt-lg-0 align-items-center">
                <a href="#login-modal" id="nav-login-btn" class="btn btn-outline-dark btn-sm" data-i18n="navLogin">Кіру</a>

<main class="container py-5" id="order-main-container">
    <section id="order-form-section">
        <h1 class="display-6 text-center mb-3" style="color: #5C061C;" data-i18n="orderTitle">ТАПСЫРЫС БЕРУ</h1>
        <p class="lead text-center text-body-secondary mb-5" data-i18n="orderSub">Тапсырыс беру үшін төмендегі форманы толтырыңыз</p>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border p-4 p-md-5">
                    <form id="order-checkout-form">
                        <div class="mb-3">
                            <label for="fullname" class="form-label fw-bold" data-i18n="fullNameLabel">Аты-жөніңіз:</label>
                            <input type="text" class="form-control" id="fullname" placeholder="Толық аты-жөніңізді енгізіңіз" data-i18n="phFullName" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label fw-bold" data-i18n="phoneInputLabel">Телефон нөміріңіз:</label>
                            <input type="tel" class="form-control" id="phone" placeholder="+7 (700) 000-00-00" required>
                        </div>
                        <div class="mb-3">
                            <label for="region" class="form-label fw-bold" data-i18n="regionLabel">Жеткізу аймағы (Қала / Облыс):</label>
                            <select id="region" class="form-select custom-styled-select" required>
                                <option value="" data-i18n="optSelectRegion">Аймақты таңдаңыз...</option>
                                <optgroup label="Республикалық маңызы бар қалалар" data-i18n-group="optGroupCities">
                                    <option value="astana" data-i18n="optAstana">Астана қаласы</option>
                                    <option value="almaty" data-i18n="optAlmaty">Алматы қаласы</option>
                                    <option value="shymkent" data-i18n="optShymkent">Шымкент қаласы</option>
                                </optgroup>
                                <optgroup label="Облыстар мен Орталықтар" data-i18n-group="optGroupRegions">
                                    <option value="zko" data-i18n="optZko">Батыс Қазақстан облысы (Орал)</option>
                                    <option value="akmola" data-i18n="optAkmola">Ақмола облысы (Көкшетау)</option>
                                    <option value="aktobe" data-i18n="optAktobe">Ақтөбе облысы</option>
                                    <option value="almaty-obl" data-i18n="optAlmatyObl">Алматы облысы (Қонаев)</option>
                                    <option value="atyrau" data-i18n="optAtyrau">Атырау облысы</option>
                                    <option value="zhabyl" data-i18n="optZhambyl">Жамбыл облысы (Тараз)</option>
                                    <option value="zhetysu" data-i18n="optZhetysu">Жетісу облысы (Талдықорған)</option>
                                    <option value="karaganda" data-i18n="optKaraganda">Қарағанды облысы</option>
                                    <option value="kostanay" data-i18n="optKostanay">Қостанай облысы</option>
                                    <option value="kyzylorda" data-i18n="optKyzylorda">Қызылорда облысы</option>
                                    <option value="mangystau" data-i18n="optMangystau">Маңғыстау облысы (Ақтау)</option>
                                    <option value="pavlodar" data-i18n="optPavlodar">Павлодар облысы</option>
                                    <option value="sko" data-i18n="optSko">Солтүстік Қазақстан облысы (Петропавл)</option>
                                    <option value="turkestan" data-i18n="optTurkestan">Түркістан облысы</option>
                                    <option value="vko" data-i18n="optVko">Шығыс Қазақстан облысы (Өскемен)</option>
                                    <option value="abai" data-i18n="optAbai">Абай облысы (Семей)</option>
                                    <option value="ulytau" data-i18n="optUlytau">Ұлытау облысы (Жезқазған)</option>
                                </optgroup>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label fw-bold" data-i18n="addressInputLabel">Жеткізу мекенжайы:</label>
                            <input type="text" class="form-control" id="address" placeholder="көше, үй, пәтер" data-i18n="phAddress" required>
                        </div>
                        <div class="mb-4">
                            <label for="payment" class="form-label fw-bold" data-i18n="paymentLabel">Төлем түрі:</label>
                            <select id="payment" class="form-select custom-styled-select" required>
                                <option value="" data-i18n="optSelectPayment">Төлем әдісін таңдаңыз...</option>
                                <option value="kaspi-qr" data-i18n="optKaspi">Kaspi QR / Red / Плюс</option>
                                <option value="card" data-i18n="optCard">Банк картасымен онлайн төлеу</option>
                                <option value="cash" data-i18n="optCash">Жеткізілгенде қолма-қол төлеу</option>
                            </select>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" id="submit-order-btn" class="btn btn-dark btn-lg" style="background-color: #5C061C; border: none;" data-i18n="btnConfirmOrder">Тапсырысты растау</button>
                            <a href="catalog.html" id="back-to-catalog-btn" class="btn btn-outline-dark" data-i18n="btnBackCatalog">Каталогқа оралу</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</main>

<footer class="container-fluid border-top text-center py-4 mt-5">
    <p class="small text-body-secondary mb-0" data-i18n="footerText">&copy; 2026 TOGYZ BRAND. Барлық құқықтар қорғалған.</p>
</footer>

<!-- Modals -->
<div id="login-modal" class="modal-overlay">
    <div class="modal-content">
        <a href="#" class="close-btn" id="close-login-btn">&times;</a>
        <h3 data-i18n="modalLoginTitle">Жүйеге кіру</h3>
        <form class="auth-form" id="order-login-form">
            <div class="form-group mb-2">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" class="form-control" required>
            </div>
            <div class="form-group mb-2">
                <label for="login-pass" data-i18n="labelPass">Құпия сөз:</label>
                <input type="password" id="login-pass" class="form-control" required>
            </div>
            <button type="submit" id="order-login-submit" class="btn btn-dark w-100 mt-2" data-i18n="navLogin">Кіру</button>
        </form>
    </div>
</div>

<div id="signup-modal" class="modal-overlay">
    <div class="modal-content">
        <a href="#" class="close-btn" id="close-signup-btn">&times;</a>
        <h3 data-i18n="modalSignupTitle">Тіркелу</h3>
        <form class="auth-form" id="order-signup-form">
            <div class="form-group mb-2">
                <label for="reg-name" data-i18n="labelName">Аты-жөні:</label>
                <input type="text" id="reg-name" class="form-control" required>
            </div>
            <div class="form-group mb-2">
                <label for="reg-email">Email:</label>
                <input type="email" id="reg-email" class="form-control" required>
            </div>
            <div class="form-group mb-2">
                <label for="reg-pass" data-i18n="labelPass">Құпия сөз:</label>
                <input type="password" id="reg-pass" class="form-control" required>
            </div>
            <button type="submit" id="order-signup-submit" class="btn btn-dark w-100 mt-2" data-i18n="navRegister">Тіркелу</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
